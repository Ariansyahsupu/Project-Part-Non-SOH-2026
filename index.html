      function rowMatchesSite(row, headers, site) {
          if (site === 'ALL') return true;
          const siteCols = headers.map((h, i) => {
              if (!h) return -1;
              const ht = h.toLowerCase();
              return (ht.includes('site') || ht.includes('plant') || ht.includes('olant') || ht.includes('name 1')) ? i : -1;
          }).filter(i => i !== -1);
          
          if (siteCols.length > 0) {
              for (let idx of siteCols) {
                  const cellVal = (row[idx] || '').trim().toUpperCase();
                  if (cellVal === site || cellVal.includes(site)) {
                       if (site === 'MAS' && cellVal.includes('COMEX')) continue; 
                       return true;
                  }
              }
              return false;
          } else {
              const rowText = row.join(' ').toUpperCase();
              if (site === 'MAS' && rowText.includes('COMEX MAS')) {
                  const withoutComex = rowText.replace(/COMEX MAS/g, '');
                  return /\\bMAS\\b/.test(withoutComex);
              }
              return rowText.includes(site);
          }
      }

          const sign = val < 0 ? '-' : '';
          const absVal = Math.abs(val);
          if (absVal >= 1000000000) return sign + 'Rp ' + (absVal / 1000000000).toFixed(3) + ' M';
          else return sign + 'Rp ' + (absVal / 1000000).toFixed(1) + ' Jt';
      }

      function parseCurrency(val) {
          if (!val) return 0;
          let clean = val.trim().replace(/[^0-9,.-]/g, '');
          if (!clean) return 0;
          
          const dotCount = (clean.match(/\\./g) || []).length;
          const commaCount = (clean.match(/,/g) || []).length;
          
          if (dotCount > 1) {
              clean = clean.replace(/\\./g, '').replace(/,/g, '.');
          } else if (commaCount > 1) {
              clean = clean.replace(/,/g, '');
          } else if (dotCount === 1 && commaCount === 1) {
              if (clean.indexOf('.') < clean.indexOf(',')) clean = clean.replace(/\\./g, '').replace(/,/g, '.');
              else clean = clean.replace(/,/g, '');
          } else if (dotCount === 1 && commaCount === 0) {
              const parts = clean.split('.');
              if (parts[parts.length - 1].length === 3) clean = clean.replace(/\\./g, '');
          } else if (commaCount === 1 && dotCount === 0) {
              const parts = clean.split(',');
              if (parts[parts.length - 1].length === 3) clean = clean.replace(/,/g, '');
              else clean = clean.replace(/,/g, '.');
          }
          
          const num = parseFloat(clean);
          return isNaN(num) ? 0 : num;
      }

      function parseCSV(text) {
          let lines = [];
          let row = [""];
          let inQuotes = false;
          for (let i = 0; i < text.length; i++) {
              let c = text[i];
              let next = text[i+1];
              if (c === '"') {
                  if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                  else { inQuotes = !inQuotes; }
              } else if (c === ',' && !inQuotes) {
                  row.push('');
              } else if ((c === '\\r' || c === '\\n') && !inQuotes) {
                  if (c === '\\r' && next === '\\n') { i++; }
                  lines.push(row);
                  row = [''];
              } else {
                  row[row.length - 1] += c;
              }
          }
          if (row.length > 1 || row[0] !== '') lines.push(row);
          return lines;
      }

      function renderPdtyChart(data) {
          let svg = '';
          let total = Object.values(data).reduce((a, b) => a + b, 0);
          let startAngle = 0;
          let colors = ['#0B1329', '#1C2541', '#2A446C', '#475E80', '#687D94', '#9FB3C8', '#D9E2EC'];
          let colorIdx = 0;
          let legendHTML = '';

          if (total === 0) {
              document.getElementById('pdty-pie-chart').innerHTML = \`<circle cx="0" cy="0" r="100" fill="#f1f5f9" />\`;
              document.getElementById('pdty-legend').innerHTML = \`<p class="text-xs text-center text-slate-500">Belum ada data pelaksana</p>\`;
              return;
          }

          const sortedData = Object.entries(data).sort((a, b) => b[1] - a[1]);

          for (const [key, val] of sortedData) {
              let sliceAngle = (val / total) * 2 * Math.PI;
              let endAngle = startAngle + sliceAngle;
              let x1 = 100 * Math.cos(startAngle);
              let y1 = 100 * Math.sin(startAngle);
              let x2 = 100 * Math.cos(endAngle);
              let y2 = 100 * Math.sin(endAngle);
              let largeArcFlag = sliceAngle > Math.PI ? 1 : 0;
              
              if (sliceAngle >= 2 * Math.PI - 0.001) {
                   svg += \`<circle cx="0" cy="0" r="100" fill="\${colors[colorIdx]}" />\`;
              } else {
                   let pathData = [\`M 0 0\`, \`L \${x1} \${y1}\`, \`A 100 100 0 \${largeArcFlag} 1 \${x2} \${y2}\`, \`Z\`].join(' ');
                   svg += \`<path d="\${pathData}" fill="\${colors[colorIdx]}" stroke="#ffffff" stroke-width="1.5" class="transition-all hover:opacity-80 cursor-pointer" />\`;
              }
              
              legendHTML += \`
                  <div class="flex items-center justify-between text-[10px] font-bold border-b border-slate-100 pb-1.5 last:border-0">
                      <div class="flex items-center gap-2">
                          <div class="w-2.5 h-2.5 rounded-sm" style="background-color: \${colors[colorIdx]}"></div>
                          <span class="text-slate-600 uppercase">\${key}</span>
                      </div>
                      <span class="text-[#0B1329] bg-slate-50 px-1.5 py-0.5 rounded border border-gray-100">\${val.toLocaleString('id-ID')} Item (\${((val/total)*100).toFixed(1)}%)</span>
                  </div>\`;
              
              startAngle = endAngle;
              colorIdx = (colorIdx + 1) % colors.length;
          }

          const svgEl = document.getElementById('pdty-pie-chart');
          const legendEl = document.getElementById('pdty-legend');
          if(svgEl) svgEl.innerHTML = svg;
          if(legendEl) legendEl.innerHTML = legendHTML;
      }

                                   <span className="inline-block bg-green-100 text-green-800 text-[9px] font-black uppercase px-2 py-1 rounded-sm">Selesai</span>
                                ) : step.status === 'in-progress' ? (
                                   <span className="inline-block bg-[#CF584C] text-white text-[9px] font-black uppercase px-2 py-1 rounded-sm animate-pulse">Berjalan</span>
                                ) : (
                                   <span className="inline-block bg-gray-100 text-gray-500 text-[9px] font-black uppercase px-2 py-1 rounded-sm">Pending</span>
                                )}
                         </td>
                      </tr>
                   ))}
                </tbody>
             </table>
          </div>
        </div>

        <div className="bg-white rounded-sm shadow-sm border border-gray-200 overflow-hidden mt-6">
          <div className="p-4 border-b border-gray-100 bg-[#FAFAFA] flex items-center justify-between">
             <h3 className="text-xs font-black text-[#1D2B36] flex items-center gap-2 uppercase tracking-wider">
               <Camera size={16} className="text-[#8C231C]" />
               Dokumentasi CCP Pengerjaan
             </h3>
             <span className="text-[10px] text-slate-500 font-bold uppercase">Dokumentasi Aktual</span>
          </div>
          
          <div className="p-4 md:p-6 flex flex-col items-center">
            <div className="relative w-full max-w-4xl rounded-sm overflow-hidden shadow-md group bg-slate-100">
              
              <div className="aspect-[2/1] md:aspect-[21/9] w-full bg-slate-200 relative">
                <img 
                  src={ccpData[currentCcpIndex].img} 
                  alt={ccpData[currentCcpIndex].title}
                  className="w-full h-full object-cover transition-opacity duration-500"
                />
                
                <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                
                <div className="absolute bottom-0 left-0 right-0 p-5 md:p-8">
                  <div className="inline-block bg-[#8C231C] text-white text-[9px] font-black uppercase px-2 py-1 rounded-sm mb-2">
                    Foto {currentCcpIndex + 1} dari {ccpData.length}
                  </div>
                  <h4 className="text-white font-black text-lg md:text-2xl drop-shadow-md tracking-wide mb-1.5">
                    {ccpData[currentCcpIndex].title}
                  </h4>
                  <p className="text-white/90 text-xs md:text-sm font-medium drop-shadow-md leading-relaxed">
                    {ccpData[currentCcpIndex].remark}
                  </p>
                </div>
              </div>

              <button 
                onClick={prevCcp}
                className="absolute left-3 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/60 backdrop-blur-sm text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"
              >
                <ChevronLeft size={24} />
              </button>
              <button 
                onClick={nextCcp}
                className="absolute right-3 top-1/2 -translate-y-1/2 bg-black/30 hover:bg-black/60 backdrop-blur-sm text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition-all duration-300"
              >
                <ChevronRight size={24} />
              </button>
            </div>

            <div className="flex gap-2.5 mt-5">
              {ccpData.map((_, idx) => (
                <button 
                  key={idx}
                  onClick={() => setCurrentCcpIndex(idx)}
                  className={`h-2.5 rounded-full transition-all duration-300 ${
                    currentCcpIndex === idx ? 'bg-[#8C231C] w-8' : 'bg-gray-300 hover:bg-gray-400 w-2.5'
                  }`}
                  aria-label={`Go to slide ${idx + 1}`}
                />
              ))}
            </div>
          </div>
        </div>

      </div>
    </div>
  );
};

const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
